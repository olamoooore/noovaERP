name: Deployment Safety

# Guards the 2026-09-21 incident class: an auto-rollback DROPped production
# because a failed `pg_dump | gzip` was treated as a valid backup. These tests
# execute the real deployment scripts in a sandbox and fail the build if the
# safety contract (scratch-DB rollback, pipefail, .verified-only-on-success,
# deploy concurrency + pre-migration abort) regresses.

on:
  pull_request:
    branches: [main]
    paths:
      - 'deployment/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/deployment-safety.yml'
  push:
    branches: [main]
    paths:
      - 'deployment/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/deployment-safety.yml'

permissions:
  contents: read

jobs:
  deploy-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Shellcheck deployment scripts
        run: shellcheck -S error deployment/scripts/*.sh deployment/tests/deploy-safety-test.sh

      - name: Deploy-safety regression tests
        run: bash deployment/tests/deploy-safety-test.sh
