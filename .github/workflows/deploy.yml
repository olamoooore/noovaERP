name: Deploy NoovaERP to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SERVER_HOST: 72.61.126.166
  SERVER_USER: root
  PROJECT_PATH: /var/www/noovaerp
  DOMAIN: noovaerp.example.com

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: https://${{ env.DOMAIN }}/api

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Create deployment package
        run: |
          # Create deployment archive excluding unnecessary files
          # Use set +e to handle tar exit code 1 (file changed warning)
          set +e
          tar -czf deploy.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='.DS_Store' \
            --exclude='*.log' \
            --exclude='*.sql' \
            --exclude='backend/.env' \
            --exclude='.vite' \
            --exclude='*.tmp' \
            --exclude='*.swp' \
            --exclude='deploy.tar.gz' \
            .
          TAR_EXIT=$?
          set -e
          
          # Exit code 1 means "file changed" which is acceptable
          if [ $TAR_EXIT -gt 1 ]; then
            echo "tar failed with exit code $TAR_EXIT"
            exit $TAR_EXIT
          fi
          
          # Verify the archive was created
          ls -lh deploy.tar.gz

      - name: Upload to server
        run: |
          scp deploy.tar.gz ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/tmp/noovaerp-deploy.tar.gz

      - name: Deploy on server
        run: |
          ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} << 'ENDSSH'
            set -e
            
            PROJECT_PATH="${{ env.PROJECT_PATH }}"
            BACKUP_PATH="/var/www/backups/noovaerp-$(date +%Y%m%d_%H%M%S)"
            
            # Create backup of current deployment
            if [ -d "$PROJECT_PATH" ]; then
              mkdir -p /var/www/backups
              cp -r "$PROJECT_PATH" "$BACKUP_PATH"
              echo "Backup created at $BACKUP_PATH"
            fi
            
            # Create project directory if not exists
            mkdir -p "$PROJECT_PATH"
            
            # Extract new deployment
            cd "$PROJECT_PATH"
            tar -xzf /tmp/noovaerp-deploy.tar.gz
            rm /tmp/noovaerp-deploy.tar.gz
            
            # Setup backend
            cd "$PROJECT_PATH/backend"
            
            # Install/update composer dependencies
            composer install --no-dev --optimize-autoloader --no-interaction
            
            # Setup environment if first deployment
            if [ ! -f .env ]; then
              cp .env.production .env
              php artisan key:generate
            fi
            
            # Run migrations
            php artisan migrate --force
            php artisan tenants:migrate --force || true
            
            # Clear all caches to ensure fresh config from .env
            php artisan config:clear
            php artisan cache:clear
            php artisan route:clear
            php artisan view:clear
            
            # Cache routes and views (but NOT config - it reads from .env at runtime)
            php artisan route:cache || echo "Warning: route:cache failed, continuing..."
            php artisan view:cache
            php artisan event:cache
            php artisan storage:link || true
            
            # Set proper permissions
            chown -R www-data:www-data "$PROJECT_PATH"
            chmod -R 755 "$PROJECT_PATH"
            chmod -R 775 "$PROJECT_PATH/backend/storage"
            chmod -R 775 "$PROJECT_PATH/backend/bootstrap/cache"
            
            # Setup/Update Supervisor for queue worker (always update to keep config in sync)
            # Install supervisor if not present
            which supervisorctl > /dev/null 2>&1 || apt-get install -y supervisor
            mkdir -p /etc/supervisor/conf.d
            {
              echo "[program:noovaerp-worker]"
              echo "process_name=%(program_name)s_%(process_num)02d"
              echo "command=php /var/www/noovaerp/backend/artisan queue:work --sleep=3 --tries=3 --max-time=3600"
              echo "autostart=true"
              echo "autorestart=true"
              echo "stopasgroup=true"
              echo "killasgroup=true"
              echo "user=www-data"
              echo "numprocs=2"
              echo "redirect_stderr=true"
              echo "stdout_logfile=/var/www/noovaerp/backend/storage/logs/worker.log"
              echo "stopwaitsecs=3600"
            } > /etc/supervisor/conf.d/noovaerp-worker.conf
            
            supervisorctl reread
            supervisorctl update
            
            # Restart queue workers to pick up new code
            supervisorctl restart noovaerp-worker:* || true
            
            # Restart PHP-FPM
            systemctl restart php8.2-fpm || systemctl restart php8.1-fpm || true
            
            # Reload Nginx
            nginx -t && systemctl reload nginx
            
            echo "Deployment completed successfully!"
          ENDSSH

      - name: Cleanup old backups
        run: |
          ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} << 'ENDSSH'
            # Keep only last 5 backups
            cd /var/www/backups 2>/dev/null && ls -dt noovaerp-* | tail -n +6 | xargs rm -rf 2>/dev/null || true
          ENDSSH

      - name: Health check
        run: |
          sleep 10
          curl -f https://${{ env.DOMAIN }}/api/health || echo "Health check endpoint not available yet"
