name: Deploy NoovaERP to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  SERVER_HOST: 72.61.126.166
  SERVER_USER: root
  PROJECT_PATH: /var/www/noovaerp

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: https://${{ env.SERVER_HOST }}/noovaerp/api

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  build-superadmin:
    name: Build Superadmin
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: superadmin/package-lock.json

      - name: Install superadmin dependencies
        working-directory: superadmin
        run: npm ci

      - name: Build superadmin
        working-directory: superadmin
        run: npm run build
        env:
          VITE_API_URL: https://${{ env.SERVER_HOST }}/noovaerp/api

      - name: Upload superadmin build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: superadmin-dist
          path: superadmin/dist
          retention-days: 1

  deploy:
    name: Deploy to Server
    # Concurrency: one deploy at a time. New pushes wait for the running
    # deploy to finish (cancel-in-progress: false) so concurrent deploys can't
    # mutate the same tree/database at once (issue: today's incident).
    runs-on: ubuntu-latest
    needs: [build-frontend, build-superadmin]
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Download superadmin build
        uses: actions/download-artifact@v4
        with:
          name: superadmin-dist
          path: superadmin/dist

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -T 10 -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts
          echo "Host ${{ env.SERVER_HOST }}" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          echo "  ConnectTimeout 30" >> ~/.ssh/config
          # Keep the deploy SSH session alive during long, stdout-quiet
          # operations (multi-tenant pg_dump can run 5+ min with no output,
          # which used to trigger `client_loop: send disconnect: Broken pipe`
          # and abort the deploy — 2026-09-23 incident).
          echo "  ServerAliveInterval 30" >> ~/.ssh/config
          echo "  ServerAliveCountMax 10" >> ~/.ssh/config

      - name: Create deployment package
        run: |
          # Create deployment archive excluding unnecessary files
          # Use set +e to handle tar exit code 1 (file changed warning)
          set +e
          tar -czf deploy.tar.gz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='vendor' \
            --exclude='.DS_Store' \
            --exclude='*.log' \
            --exclude='*.sql' \
            --exclude='backend/.env' \
            --exclude='.vite' \
            --exclude='*.tmp' \
            --exclude='*.swp' \
            --exclude='deploy.tar.gz' \
            .
          TAR_EXIT=$?
          set -e
          
          # Exit code 1 means "file changed" which is acceptable
          if [ $TAR_EXIT -gt 1 ]; then
            echo "tar failed with exit code $TAR_EXIT"
            exit $TAR_EXIT
          fi
          
          # Verify the archive was created
          ls -lh deploy.tar.gz

      - name: Upload to server
        run: |
          scp deploy.tar.gz ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:/tmp/noovaerp-deploy.tar.gz

      - name: Deploy on server
        run: |
          ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} << 'ENDSSH'
            set -e
            
            PROJECT_PATH="${{ env.PROJECT_PATH }}"
            DEPLOY_TIMESTAMP="$(date +%Y%m%d_%H%M%S)"
            BACKUP_PATH="/var/www/backups/noovaerp-$DEPLOY_TIMESTAMP"
            DB_BACKUP_DIR="/var/www/backups/database"
            RELEASE_PATH="/tmp/noovaerp-release-$DEPLOY_TIMESTAMP"
            AUTO_ROLLBACK_MARKER="$BACKUP_PATH/.auto_rollback_allowed"
            MIGRATIONS_STARTED_MARKER="$BACKUP_PATH/.migrations_started"
            
            mkdir -p /var/www/backups "$DB_BACKUP_DIR"

            # Clear stale release staging left behind by failed deployments
            # (2026-09-21 disk-full incident: 66G of orphaned /tmp releases).
            rm -rf /tmp/noovaerp-release-* 2>/dev/null || true

            # Create backup of current deployment and allow automatic rollback
            # only until migrations begin.
            if [ -d "$PROJECT_PATH" ]; then
              cp -r "$PROJECT_PATH" "$BACKUP_PATH"
              echo "Backup created at $BACKUP_PATH"
              touch "$AUTO_ROLLBACK_MARKER"
            fi
            
            # Stage a clean release so removed files don't linger on the server.
            rm -rf "$RELEASE_PATH"
            mkdir -p "$RELEASE_PATH"
            tar -xzf /tmp/noovaerp-deploy.tar.gz -C "$RELEASE_PATH"
            rm /tmp/noovaerp-deploy.tar.gz

            # Preserve runtime state from the current deployment.
            if [ -f "$PROJECT_PATH/backend/.env" ] && [ ! -f "$RELEASE_PATH/backend/.env" ]; then
              cp "$PROJECT_PATH/backend/.env" "$RELEASE_PATH/backend/.env"
            fi
            if [ -d "$PROJECT_PATH/backend/storage" ]; then
              rm -rf "$RELEASE_PATH/backend/storage"
              mkdir -p "$RELEASE_PATH/backend"
              cp -a "$PROJECT_PATH/backend/storage" "$RELEASE_PATH/backend/storage"
            fi
            if [ -d "$PROJECT_PATH/backend/bootstrap/cache" ]; then
              mkdir -p "$RELEASE_PATH/backend/bootstrap"
              rm -rf "$RELEASE_PATH/backend/bootstrap/cache"
              cp -a "$PROJECT_PATH/backend/bootstrap/cache" "$RELEASE_PATH/backend/bootstrap/cache"
            fi
            
            # Setup backend
            cd "$RELEASE_PATH/backend"
            
            # Install/update composer dependencies
            composer install --no-dev --optimize-autoloader --no-interaction
            
            # Setup environment if first deployment
            if [ ! -f .env ]; then
              cp .env.production .env
              php artisan key:generate
            fi

            echo "Creating pre-migration database backup..."
            set -a
            . ./.env
            set +a
            TIMESTAMP="$DEPLOY_TIMESTAMP" bash "$RELEASE_PATH/deployment/scripts/backup-database.sh"
            echo "Database backup created at $DB_BACKUP_DIR for deployment $DEPLOY_TIMESTAMP"

            # P0 (2026-09-21 incident): never run migrations on an unverified
            # backup. The backup script fails hard, but re-check here so the
            # deploy aborts BEFORE the tree is replaced and migrations run.
            BACKUP_FILE="$DB_BACKUP_DIR/central_${DEPLOY_TIMESTAMP}.sql.gz"
            if [ ! -f "$BACKUP_FILE" ]; then
              echo "ABORT: pre-migration backup missing: $BACKUP_FILE"; exit 1
            fi
            if ! gzip -t "$BACKUP_FILE" 2>/dev/null; then
              echo "ABORT: pre-migration backup is corrupt: $BACKUP_FILE"; exit 1
            fi
            if [ ! -f "$DB_BACKUP_DIR/.batch_${DEPLOY_TIMESTAMP}.verified" ]; then
              echo "ABORT: backup batch ${DEPLOY_TIMESTAMP} was not verified (see $DB_BACKUP_DIR/.batch_${DEPLOY_TIMESTAMP}.failed)"; exit 1
            fi

            # Replace the deployed tree cleanly so deleted files do not survive.
            which rsync > /dev/null 2>&1 || apt-get install -y rsync
            mkdir -p "$PROJECT_PATH"
            rsync -a --delete "$RELEASE_PATH/" "$PROJECT_PATH/"

            cd "$PROJECT_PATH/backend"

            # Once migrations begin, automatic rollback is no longer safe unless
            # a human verifies code/database compatibility.
            mkdir -p "$BACKUP_PATH"
            rm -f "$AUTO_ROLLBACK_MARKER"
            touch "$MIGRATIONS_STARTED_MARKER"
            
            # Run central migrations
            php artisan migrate --force

            # Run tenant migrations (failures must fail the deployment)
            php artisan tenants:migrate --force

            touch "$BACKUP_PATH/.migrations_completed" || true
            
            # Clear all caches to ensure fresh config from .env
            php artisan config:clear
            php artisan cache:clear
            php artisan route:clear
            php artisan view:clear
            
            # Cache routes and views (but NOT config - it reads from .env at runtime)
            php artisan route:cache || echo "Warning: route:cache failed, continuing..."
            php artisan view:cache
            php artisan event:cache
            php artisan storage:link || true

            # Copy superadmin build to public web directory
            mkdir -p /var/www/superadmin
            cp -r "$PROJECT_PATH/superadmin/dist/." /var/www/superadmin/

            # Set proper permissions
            chown -R www-data:www-data "$PROJECT_PATH"
            chmod -R 755 "$PROJECT_PATH"
            chmod -R 775 "$PROJECT_PATH/backend/storage"
            chmod -R 775 "$PROJECT_PATH/backend/bootstrap/cache"
            
            # Setup/Update Supervisor for queue worker (always update to keep config in sync)
            # Install supervisor if not present
            which supervisorctl > /dev/null 2>&1 || apt-get install -y supervisor
            mkdir -p /etc/supervisor/conf.d
            {
              echo "[program:noovaerp-worker]"
              echo "process_name=%(program_name)s_%(process_num)02d"
              echo "command=php /var/www/noovaerp/backend/artisan queue:work --sleep=3 --tries=3 --max-time=3600"
              echo "autostart=true"
              echo "autorestart=true"
              echo "stopasgroup=true"
              echo "killasgroup=true"
              echo "user=www-data"
              echo "numprocs=2"
              echo "redirect_stderr=true"
              echo "stdout_logfile=/var/www/noovaerp/backend/storage/logs/worker.log"
              echo "stopwaitsecs=3600"
            } > /etc/supervisor/conf.d/noovaerp-worker.conf
            
            supervisorctl reread
            supervisorctl update
            
            # Restart queue workers to pick up new code
            supervisorctl restart noovaerp-worker:* || true
            
            # Restart OCR service to pick up new code
            systemctl restart ocr-service || true
            
            # Restart PHP-FPM
            systemctl restart php8.2-fpm || systemctl restart php8.1-fpm || true
            
            # Reload Nginx
            nginx -t && systemctl reload nginx

            rm -rf "$RELEASE_PATH"
            
            echo "Deployment completed successfully!"
          ENDSSH

      - name: Cleanup old backups
        run: |
          ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} << 'ENDSSH'
            # Keep only the last 2 release backups — rollback never needs more.
            cd /var/www/backups 2>/dev/null && ls -dt noovaerp-* 2>/dev/null | tail -n +3 | xargs -r rm -rf 2>/dev/null || true

            # Keep only the dumps of the two newest VERIFIED batches. A batch is
            # verified only when every dump passed gzip integrity (written by
            # deployment/scripts/backup-database.sh). Unverified/manual dumps
            # without a stamp are left untouched. Never prune below the newest
            # verified dump (2026-09-21 incident: pruning the last good backup
            # before a failure cascade made recovery impossible).
            cd /var/www/backups/database 2>/dev/null || exit 0
            KEEP_STAMPS=$(ls -t .batch_*.verified 2>/dev/null | sed 's#^\.batch_##; s#\.verified$##' | head -2 | tr '\n' '|' | sed 's/|$//')
            if [ -n "$KEEP_STAMPS" ]; then
              find . -maxdepth 1 -type f \( -name '*.sql' -o -name '*.sql.gz' -o -name '*.dump' \) \
                | grep -E '[0-9]{8}_[0-9]{6}' | grep -vE "($KEEP_STAMPS)" | xargs -r rm -f 2>/dev/null || true
            fi

            # Remove stale release staging dirs.
            rm -rf /tmp/noovaerp-release-* 2>/dev/null || true
          ENDSSH

      - name: Health check
        run: |
          echo "Waiting for services to start..."
          sleep 10

          echo "Running health check..."
          # Run curl from the server itself (avoids DNS dependency on external domain).
          # Retry up to 6 times: deploy finalisation (rsync/chown/storage:link) can
          # briefly race the health endpoint's storage probe — a single attempt
          # produced a false deploy failure on 2026-09-22.
          HEALTH_STATUS="000"
          for attempt in 1 2 3 4 5 6; do
            HEALTH_STATUS=$(ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1/noovaerp/api/health" 2>/dev/null) || HEALTH_STATUS="000"
            if [ "$HEALTH_STATUS" = "200" ]; then
              echo "✅ Health check passed (attempt $attempt)"
              exit 0
            fi
            echo "Attempt $attempt: HTTP $HEALTH_STATUS — retrying in 10s..."
            sleep 10
          done

          echo "❌ Health check failed with HTTP $HEALTH_STATUS"
          echo "Health body:"
          ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "curl -sk https://127.0.0.1/noovaerp/api/health"
          echo "Deployment may have issues. Check logs:"
          ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} "tail -100 /var/www/noovaerp/backend/storage/logs/laravel.log"
          exit 1

      - name: Rollback on failure
        if: failure()
        run: |
          echo "Deployment failed. Rolling back..."
          ssh ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} '
            LATEST=$(ls -dt /var/www/backups/noovaerp-* 2>/dev/null | head -1)
            if [ -z "$LATEST" ]; then
              echo "No backup found to roll back to"
              exit 0
            fi

            if [ ! -f "$LATEST/.auto_rollback_allowed" ]; then
              if [ -f "$LATEST/.migrations_started" ]; then
                echo "Migrations already started for this deployment; skipping automatic rollback to avoid code/database mismatch."
                exit 0
              fi

              echo "Automatic rollback is not allowed for the latest deployment state."
              exit 0
            fi

            if [ -n "$LATEST" ]; then
              echo "Rolling back to: $LATEST"
              bash /var/www/noovaerp/deployment/scripts/rollback.sh "$LATEST"
            fi
          '
