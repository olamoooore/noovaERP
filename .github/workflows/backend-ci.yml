name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  backend-tests:
    name: Laravel Backend Tests (${{ matrix.label }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        bucket: [1, 2, 3, 4]
        include:
          - bucket: 1
            label: 'Feature 1/4'
          - bucket: 2
            label: 'Feature 2/4'
          - bucket: 3
            label: 'Feature 3/4'
          - bucket: 4
            label: 'Feature 4/4'

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: noovaerp_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d noovaerp_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: true
      APP_URL: http://localhost:8000
      APP_DOMAIN: localhost
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: noovaerp_ci
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      REDIS_CLIENT: phpredis
      CENTRAL_DOMAINS: localhost

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, pdo_pgsql, pgsql, sqlite3
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-php-8.2-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.2-

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Preflight checks
        working-directory: backend
        run: |
          set -euo pipefail
          echo "--- Checking bootstrap/cache ---"
          test -d bootstrap/cache || { echo "FAIL: bootstrap/cache missing"; exit 1; }
          test -w bootstrap/cache || { echo "FAIL: bootstrap/cache not writable"; exit 1; }
          echo "bootstrap/cache exists and is writable"
          echo "--- Checking php extensions ---"
          php -m | grep -q pdo_pgsql || { echo "FAIL: pdo_pgsql extension missing"; exit 1; }
          php -m | grep -q pgsql || { echo "FAIL: pgsql extension missing"; exit 1; }
          echo "PHP extensions OK"

      - name: Scan for direct Customer::create() bypasses
        working-directory: backend
        run: |
          set -euo pipefail
          echo "--- Scanning for direct Customer::create() outside allowed paths ---"
          # Allowed: CanonicalCustomerService, CustomerController (canonical API with DB::transaction), tests, factories, seeders, migrations
          VIOLATIONS=$(grep -rn 'Customer::create\|Customer::firstOrCreate\|Customer::query()->create' \
            --include='*.php' \
            --exclude-dir=vendor \
            --exclude-dir=tests \
            --exclude-dir=database \
            app/ modules/ \
            | grep -v 'CanonicalCustomerService.php' \
            | grep -v 'CustomerController.php' \
            | grep -v 'Factory.php' \
            | grep -v 'Seeder.php' \
            | grep -v 'Migration' \
            | grep -v 'Tests/' \
            || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "FAIL: Direct Customer creation found outside CanonicalCustomerService:"
            echo "$VIOLATIONS"
            echo ""
            echo "All production customer creation must go through CanonicalCustomerService."
            exit 1
          fi
          echo "No direct Customer::create() bypasses found"

      - name: Prepare Laravel environment
        working-directory: backend
        run: |
          set -euo pipefail
          cp .env.example .env
          php artisan key:generate

      - name: Run central migrations
        working-directory: backend
        run: |
          set -euo pipefail
          php artisan migrate --force

      - name: Run tenancy configuration regression test
        working-directory: backend
        run: |
          set -euo pipefail
          php artisan test tests/Feature/TenancyProvisioningConfigurationTest.php

      - name: Run PostgreSQL tenant provisioning smoke test
        working-directory: backend
        continue-on-error: true
        run: |
          set -euo pipefail
          php scripts/assert_tenant_provisioning.php

      - name: Run PRD closure gate proof tests
        working-directory: backend
        run: |
          set -euo pipefail
          php -d memory_limit=256M artisan test --filter "RM001SchedulerMonitoringTest|RM002SalesFulfilmentWarehouseResolutionTest|RM002PosWarehouseCommitmentTest|RM002SubscriptionTierWarehouseModelTest|RM003LoyaltyRewardStockBoundaryTest|LEG001LegacyReservationClosureTest|AR001MutationOwnershipTest|AR002MovementIdempotencyTest|AR003RowLockingConcurrencyTest|AR004PostingEngineBoundaryTest|ENT001PostingNoopSafetyTest|AFM001AccountingFailureModelTest"

      - name: Run Feature test suite (bucket ${{ matrix.bucket }}/4)
        working-directory: backend
        run: |
          set -euo pipefail

          # Partition the Feature test files alphabetically into 4 balanced buckets.
          # Each bucket gets ceil(TOTAL/4) files. Bucket assignment is deterministic
          # because we sort by absolute path.
          FEATURE_FILES=$(find tests/Feature modules/HRM/tests/Feature -name "*.php" -type f | LC_ALL=C sort)
          TOTAL=$(echo "$FEATURE_FILES" | wc -l | tr -d ' ')
          PER=$(( (TOTAL + 3) / 4 ))
          START_LINE=$(( (matrix.bucket - 1) * PER + 1 ))
          END_LINE=$(( matrix.bucket * PER ))
          if [ "$END_LINE" -gt "$TOTAL" ]; then END_LINE="$TOTAL"; fi

          SELECTED=$(echo "$FEATURE_FILES" | sed -n "${START_LINE},${END_LINE}p")

          if [ -z "$SELECTED" ]; then
            echo "Bucket ${{ matrix.bucket }} has no assigned files; skipping."
            exit 0
          fi

          COUNT=$(echo "$SELECTED" | wc -l | tr -d ' ')
          echo "Running bucket ${{ matrix.bucket }}/4 — $COUNT files (lines $START_LINE-$END_LINE of $TOTAL):"
          echo "$SELECTED"

          # shellcheck disable=SC2086
          php -d memory_limit=256M artisan test $SELECTED

      - name: Run OCR test suite
        working-directory: backend
        run: |
          set -euo pipefail
          php -d memory_limit=256M artisan test --testsuite=OCR

      - name: Run FinancialReporting test suite
        working-directory: backend
        run: |
          set -euo pipefail
          php -d memory_limit=256M artisan test --testsuite=FinancialReporting