name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  backend-tests:
    name: Laravel Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: noovaerp_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d noovaerp_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: true
      APP_URL: http://localhost:8000
      APP_DOMAIN: localhost
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: noovaerp_ci
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      CACHE_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      REDIS_CLIENT: phpredis
      CENTRAL_DOMAINS: localhost

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, fileinfo, pdo_pgsql, pgsql, sqlite3
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: ${{ runner.os }}-php-8.2-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.2-

      - name: Install backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare Laravel environment
        working-directory: backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run central migrations
        working-directory: backend
        run: php artisan migrate --force

      - name: Run tenancy configuration regression test
        working-directory: backend
        run: php artisan test tests/Feature/TenancyProvisioningConfigurationTest.php

      - name: Run PostgreSQL tenant provisioning smoke test
        working-directory: backend
        run: php scripts/assert_tenant_provisioning.php

      - name: Run Feature test suite
        working-directory: backend
        run: php -d memory_limit=256M artisan test --testsuite=Feature

      - name: Run OCR test suite
        working-directory: backend
        run: php -d memory_limit=256M artisan test --testsuite=OCR

      - name: Run FinancialReporting test suite
        working-directory: backend
        run: php -d memory_limit=256M artisan test --testsuite=FinancialReporting