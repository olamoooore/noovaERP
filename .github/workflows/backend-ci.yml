name: Backend CI

# Four parallel jobs (gates, feature, ocr, financial-reporting) instead of one
# serial job: the old layout ran every suite back-to-back and the Feature suite
# hit its 10-minute step timeout, failing the whole run after ~11 minutes with
# no test failures reported. Gates now report in ~3 minutes; suites run
# concurrently; each job gets a realistic timeout.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - '.github/actions/backend-setup/**'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
      - '.github/actions/backend-setup/**'
  workflow_dispatch:

# Shared job environment (applies to every job).
env:
  APP_ENV: testing
  APP_DEBUG: true
  APP_URL: http://localhost:8000
  APP_DOMAIN: localhost
  DB_CONNECTION: pgsql
  DB_HOST: 127.0.0.1
  DB_PORT: 5432
  DB_DATABASE: noovaerp_ci
  DB_USERNAME: postgres
  DB_PASSWORD: postgres
  CACHE_DRIVER: array
  CACHE_STORE: array
  QUEUE_CONNECTION: sync
  SESSION_DRIVER: array
  MAIL_MAILER: array
  REDIS_CLIENT: phpredis
  CENTRAL_DOMAINS: localhost
  OCR_SERVICE_KEY: test-ocr-service-key

jobs:
  gates:
    name: Gates & PRD proof tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: noovaerp_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d noovaerp_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Backend setup
        uses: ./.github/actions/backend-setup

      - name: Preflight checks
        working-directory: backend
        run: |
          set -euo pipefail
          echo "--- Checking bootstrap/cache ---"
          test -d bootstrap/cache || { echo "FAIL: bootstrap/cache missing"; exit 1; }
          test -w bootstrap/cache || { echo "FAIL: bootstrap/cache not writable"; exit 1; }
          echo "bootstrap/cache exists and is writable"
          echo "--- Checking php extensions ---"
          php -m | grep -q pdo_pgsql || { echo "FAIL: pdo_pgsql extension missing"; exit 1; }
          php -m | grep -q pgsql || { echo "FAIL: pgsql extension missing"; exit 1; }
          echo "PHP extensions OK"

      - name: Scan for direct Customer::create() bypasses
        working-directory: backend
        run: |
          set -euo pipefail
          echo "--- Scanning for direct Customer::create() outside allowed paths ---"
          # Allowed: CanonicalCustomerService, CustomerController (canonical API with DB::transaction), tests, factories, seeders, migrations
          VIOLATIONS=$(grep -rn 'Customer::create\|Customer::firstOrCreate\|Customer::query()->create' \
            --include='*.php' \
            --exclude-dir=vendor \
            --exclude-dir=tests \
            --exclude-dir=database \
            app/ modules/ \
            | grep -v 'CanonicalCustomerService.php' \
            | grep -v 'CustomerController.php' \
            | grep -v 'Factory.php' \
            | grep -v 'Seeder.php' \
            | grep -v 'Migration' \
            | grep -v 'Tests/' \
            || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "FAIL: Direct Customer creation found outside CanonicalCustomerService:"
            echo "$VIOLATIONS"
            echo ""
            echo "All production customer creation must go through CanonicalCustomerService."
            exit 1
          fi
          echo "No direct Customer::create() bypasses found"

      - name: Run tenancy configuration regression test
        working-directory: backend
        run: |
          set -euo pipefail
          php artisan test tests/Feature/TenancyProvisioningConfigurationTest.php

      - name: Run PostgreSQL tenant provisioning smoke test
        working-directory: backend
        continue-on-error: true
        run: |
          set -euo pipefail
          php scripts/assert_tenant_provisioning.php

      - name: Run PRD closure gate proof tests
        working-directory: backend
        run: |
          set -euo pipefail
          php -d memory_limit=256M artisan test --filter "RM001SchedulerMonitoringTest|RM002SalesFulfilmentWarehouseResolutionTest|RM002PosWarehouseCommitmentTest|RM002SubscriptionTierWarehouseModelTest|RM003LoyaltyRewardStockBoundaryTest|LEG001LegacyReservationClosureTest|AR001MutationOwnershipTest|AR002MovementIdempotencyTest|AR003RowLockingConcurrencyTest|AR004PostingEngineBoundaryTest|ENT001PostingNoopSafetyTest|AFM001AccountingFailureModelTest"

  feature:
    name: Feature test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: noovaerp_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d noovaerp_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Backend setup
        uses: ./.github/actions/backend-setup

      - name: Run Feature test suite
        working-directory: backend
        run: |
          set -euo pipefail
          php -d memory_limit=256M artisan test --parallel --processes=4 --testsuite=Feature

  ocr:
    name: OCR test suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: noovaerp_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d noovaerp_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Backend setup
        uses: ./.github/actions/backend-setup

      - name: Run OCR test suite
        working-directory: backend
        run: |
          set -euo pipefail
          php -d memory_limit=256M artisan test --parallel --processes=4 --testsuite=OCR

  financial-reporting:
    name: FinancialReporting test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: noovaerp_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d noovaerp_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Backend setup
        uses: ./.github/actions/backend-setup

      - name: Run FinancialReporting test suite
        working-directory: backend
        run: |
          set -euo pipefail
          php -d memory_limit=256M artisan test --parallel --processes=4 --testsuite=FinancialReporting
