name: Frontend CI

# Issue #364: `npm run build` is `vite build`, which does not type-check, and no
# workflow ran tsc or eslint, so type errors shipped. This job runs tsc and
# eslint for frontend/ and superadmin/ through a ratchet
# (scripts/ci/ts-lint-ratchet.mjs): findings already recorded in
# <app>/ci-baseline/*.json are tolerated, any NEW finding fails the job.
# See README.md ("Typecheck / lint ratchet") for how to update the baseline.
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'superadmin/**'
      - 'scripts/ci/**'
      - '.github/workflows/frontend-ci.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'superadmin/**'
      - 'scripts/ci/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck-lint:
    name: Typecheck + lint (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [frontend, superadmin]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        id: install
        run: npm ci

      - name: Typecheck (tsc ratchet)
        run: npm run typecheck:ci

      - name: Lint (eslint ratchet)
        if: always() && steps.install.outcome != 'failure'
        run: npm run lint:ci
